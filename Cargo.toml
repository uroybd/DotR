[package]
name = "dotr-dear"
description = "A dotfiles manager as dear as a daughter."
authors = ["Utsob Roy <connect@utsob.me>"]
license = "MIT"
version = "1.4.1"
edition = "2024"
repository = "https://github.com/uroybd/dotr"

[[bin]]
name = "dotr"
path = "src/main.rs"

[[bin]]
name = "mangen"
path = "src/bin/mangen.rs"
required-features = ["mangen"]

[features]
mangen = ["dep:clap_mangen"]

[dependencies]
anyhow = "1.0.100"
diff = "0.1.13"
glob-match = "0.2.1"
regex = "1.12.2"
tera = "2"
toml = { version = "1.1.2", features = ["serde", "display"] }
uuid = { version = "1.18.1", features = ["v4"] }
walkdir = "2.5.0"
clap_complete = "4.6.7"
clap_complete_nushell = "4.6.0"

[dependencies.clap]
version = "4.5.51"
features = ["derive"]

[dependencies.clap_mangen]
version = "0.3.0"
optional = true

[dependencies.serde]
version = "1.0.228"
features = ["derive"]

[profile.release]
lto = true    # Link Time Optimization - improves speed and size
strip = true  # Strip symbols - reduces size without performance impact

# Configure tests to run sequentially by default
[profile.test]
opt-level = 0
